name: jungle-wager-local
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: wager
      POSTGRES_USER: wager_local
      POSTGRES_PASSWORD: wager_local_only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["wager-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager_local -d wager"]
      interval: 2s
      timeout: 3s
      retries: 30
  localstack:
    image: localstack/localstack:4.9.2@sha256:59373b4a27dba3ec15c4db0b7455f0cb68c8a42300e2cbbe362b440f9a131697
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
      SQS_ENDPOINT_STRATEGY: path
      PERSISTENCE: "0"
    ports: ["127.0.0.1:4568:4566"]
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 3s
      timeout: 5s
      retries: 30
  setup:
    profiles: ["app"]
    build: .
    environment: &app-env
      DATABASE_URL: postgresql://wager_local:wager_local_only@postgres:5432/wager
      SQS_ENDPOINT: http://localstack:4566
      HOST: 0.0.0.0
      PORT: 3100
    command: ["sh", "-c", "bun scripts/migrate.ts up && bun scripts/queues.ts"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
  app:
    profiles: ["app"]
    build: .
    environment: *app-env
    ports: ["127.0.0.1:3100:3100"]
    init: true
    stop_grace_period: 30s
    depends_on:
      setup: { condition: service_completed_successfully }
volumes:
  wager-db:
