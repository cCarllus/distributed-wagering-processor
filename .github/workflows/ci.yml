name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, build and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      BUN_VERSION: "1.3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check documentation links
        run: bun run check:docs

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build server and dashboard
        run: bun run build

      - name: Start PostgreSQL and local SQS
        run: docker compose up -d --wait --wait-timeout 180 postgres localstack

      - name: Run all tests with real containers
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          bun test --timeout 120000 --reporter=junit --reporter-outfile=.artifacts/junit.xml 2>&1 | tee .artifacts/test.log

      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p .artifacts
          docker compose ps -a > .artifacts/compose-status.txt 2>&1
          docker compose logs --no-color --timestamps > .artifacts/compose.log 2>&1

      - name: Upload test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.sha }}
          path: |
            .artifacts/junit.xml
            .artifacts/test.log
            .artifacts/compose-status.txt
            .artifacts/compose.log
            .artifacts/tests/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified compiled output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ github.sha }}
          path: |
            dist/
            public/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up job containers
        if: always()
        run: docker compose down --volumes --remove-orphans
